[project]
name = "indian-stocks-mcp"
version = "0.3.0"
description = "India-only (NSE/BSE) stock MCP server with verifiable point-in-time (as_of) enforcement"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Shubhampm18", email = "shubhampmalik4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp==1.12.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=24.0.0",
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
# Distribution renamed to indian-stocks-mcp (the old PyPI name belongs to an
# unrelated project). The import package stays stock_analyst_mcp. A legacy
# console script "stock-analyst-mcp" is kept so existing local invocations
# (client.py/chat.py style) keep working from installed dists.
indian-stocks-mcp = "stock_analyst_mcp:main"
stock-analyst-mcp = "stock_analyst_mcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# Distribution renamed to indian-stocks-mcp but the import package stays
# stock_analyst_mcp — uv_build would otherwise infer src/indian_stocks_mcp.
[tool.uv.build-backend]
module-name = "stock_analyst_mcp"

[tool.pytest.ini_options]
markers = ["network: network-dependent tests (skip offline)"]
